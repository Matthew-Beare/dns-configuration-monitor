name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q src tests run.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Publication safety and screenshot integrity
        run: python verify_publication.py
      - name: Replay demonstration
        run: python run.py
